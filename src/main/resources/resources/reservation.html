<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бронирование — Test Hotel Inn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="header-icon" title="На главную" aria-label="На главную">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <h1 class="header-title">Test Hotel Inn</h1>
  <a href="/register.html" class="header-icon" title="Регистрация" aria-label="Регистрация">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </a>
</header>

<main class="container">

  <section class="card form-card">
    <h2>Бронирование номера</h2>
    <p class="form-hint">Заполните форму, чтобы забронировать номер</p>

    <form id="reservationForm">
      <label>ID пользователя
        <input type="number" name="userId" placeholder="например, 1" required>
      </label>
      <label>ID комнаты
        <input type="number" name="roomId" placeholder="например, 101" required>
      </label>
      <label>Дата заезда
        <input type="date" name="startDate" required>
      </label>
      <label>Дата выезда
        <input type="date" name="endDate" required>
      </label>
      <button type="submit" class="btn btn-primary">Забронировать</button>
    </form>
    <div id="reservationResult" class="result"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
